[project]
name = "rag-diagnostics"
version = "0.1.0"
description = "非侵入式 RAG 诊断与自动优化系统 MVP"
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "dspy>=2.6.0",
    "langchain-openai>=0.3.0",
    "langchain-google-vertexai>=2.0.0",
    "nest-asyncio>=1.6.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "ragas>=0.4.0",
    "datasets>=3.0.0",
    "openai>=1.50.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
